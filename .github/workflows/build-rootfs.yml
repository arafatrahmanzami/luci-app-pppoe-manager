name: Build rootfs.tar.gz (ImageBuilder)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: rootfs-${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: imou-hx21
            imagebuilder: immortalwrt-imagebuilder-24.10.6-mediatek-filogic.Linux-x86_64.tar.zst
            subdir: targets/mediatek/filogic
            profile: imou_lc-hx3001
          - label: x86-64
            imagebuilder: immortalwrt-imagebuilder-24.10.6-x86-64.Linux-x86_64.tar.zst
            subdir: targets/x86/64
            profile: generic

    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential gawk wget zstd rsync file \
            libncurses-dev zlib1g-dev libssl-dev python3

      - name: Download ImageBuilder
        run: |
          URL="https://downloads.immortalwrt.org/releases/24.10.6/${{ matrix.subdir }}/${{ matrix.imagebuilder }}"
          echo "Fetching: $URL"
          wget -q -O ib.tar.zst "$URL"
          mkdir ib
          tar -xf ib.tar.zst -C ib --strip-components=1
          echo "=== ImageBuilder contents ==="
          ls -la ib/ | head -30

      - name: Show available profiles
        working-directory: ib
        run: |
          echo "=== Profiles list ==="
          make info 2>&1 | tee /tmp/ib-profiles.log
          echo ""
          echo "=== Looking for IMOU ==="
          grep -i -E 'imou|lc-hx|hx21' /tmp/ib-profiles.log || echo "IMOU profile NOT FOUND"

      - name: Copy package into ImageBuilder
        run: |
          mkdir -p ib/package/luci-app-pppoe-manager
          rsync -a --exclude='.git' --exclude='.github' src/ ib/package/luci-app-pppoe-manager/

      - name: Enable TARGZ in .config
        working-directory: ib
        run: |
          if [ ! -f .config ]; then
            echo "ERROR: .config missing in ImageBuilder"
            exit 1
          fi
          sed -i '/CONFIG_TARGET_ROOTFS_TARGZ/d' .config
          echo "CONFIG_TARGET_ROOTFS_TARGZ=y" >> .config
          echo "=== TARGZ config lines ==="
          grep -E "TARGZ" .config || echo "not found"

      - name: Build rootfs
        working-directory: ib
        run: |
          set -o pipefail
          make image \
            PROFILE="${{ matrix.profile }}" \
            PACKAGES="luci-app-pppoe-manager rp-pppoe-server rp-pppoe-common ppp ppp-mod-pppoe conntrack" \
            V=s 2>&1 | tee /tmp/ib-build.log
          echo ""
          echo "=== BUILD SUCCEEDED, exit=$? ==="
          echo ""
          echo "=== Files in bin/targets ==="
          find bin/targets -type f 2>/dev/null | sort

      - name: Collect rootfs
        run: |
          mkdir -p out
          find ib/bin/targets -name "*rootfs*.tar.gz" -exec cp {} out/ \;
          echo "=== Collected files ==="
          ls -lh out/
          count=$(ls -1 out/ 2>/dev/null | wc -l)
          echo "File count: $count"
          if [ "$count" -eq 0 ]; then
            echo "!!! NO FILES COLLECTED — printing build log !!!"
            tail -80 /tmp/ib-build.log
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ matrix.label }}
          path: out/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
