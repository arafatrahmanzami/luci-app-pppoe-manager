name: Build APK (OpenWrt 25.12+)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: imou-hx21
            sdk: openwrt-sdk-25.12.0-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            subdir: targets/mediatek/filogic
          - label: x86-64
            sdk: openwrt-sdk-25.12.0-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            subdir: targets/x86/64
          - label: ramips-mt7621
            sdk: openwrt-sdk-25.12.0-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            subdir: targets/ramips/mt7621

    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libncurses-dev zlib1g-dev gawk \
            git gettext libssl-dev xsltproc wget unzip python3 time zstd rsync file

      - name: Download and extract SDK
        run: |
          URL="https://downloads.openwrt.org/releases/25.12.0/${{ matrix.subdir }}/${{ matrix.sdk }}"
          echo "Fetching: $URL"
          wget -q -O sdk.tar.zst "$URL"
          mkdir sdk
          tar -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Copy package into SDK
        run: |
          mkdir -p sdk/package/luci-app-pppoe-manager
          rsync -a --exclude='.git' --exclude='.github' src/ sdk/package/luci-app-pppoe-manager/

      - name: Feeds update and install
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for APK
        working-directory: sdk
        run: |
          echo "CONFIG_USE_APK=y" >> .config
          echo "CONFIG_SIGNED_PACKAGES=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-pppoe-manager=y" >> .config
          make defconfig

      - name: Compile APK
        working-directory: sdk
        run: make CONFIG_USE_APK=y package/luci-app-pppoe-manager/compile V=s

      - name: Collect APK
        run: |
          mkdir -p out
          find sdk/bin -name "luci-app-pppoe-manager*.apk" -exec cp {} out/ \;
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.label }}
          path: out/*.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
